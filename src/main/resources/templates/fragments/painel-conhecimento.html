<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Composite: "galho" da arvore de componentes dedicado a gestao do conhecimento e configuracoes da sessao -->
<div th:fragment="painel(documento, temDocumento, estrategiaAtual, estrategias, metricas, estadoSessao)" class="painel-conhecimento controles-wrapper" style="display: contents;">

    <!-- Status do documento (cartao no estilo "word card") -->
    <section class="card-palavra" aria-label="Documento da base de conhecimento">
        <div class="card-palavra-topo">
            <div class="card-palavra-linha">
                <span class="rotulo">documento</span>
                <span class="icone-circulo" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V9h5.5L13 3.5zM8 13h8v1.6H8V13zm0 3.4h8V18H8v-1.6z"/></svg>
                </span>
            </div>
            <p th:if="${temDocumento}" class="palavra" th:text="${documento.nome}">manual.txt</p>
            <p th:unless="${temDocumento}" class="palavra vazia">Nenhum</p>
        </div>
        <div class="card-palavra-uso">
            <h4>Base de conhecimento</h4>
            <p th:if="${temDocumento}">
                <span th:text="${documento.tamanhoBytes}">1024</span> bytes · carregado em
                <span th:text="${#temporals.format(documento.dataCarregamento, 'dd/MM/yyyy HH:mm:ss')}">data</span>
            </p>
            <p th:unless="${temDocumento}">
                Nenhum documento carregado. O assistente usara respostas genericas ou instruira o carregamento de um arquivo.
            </p>
            <form th:if="${temDocumento}" th:action="@{/chat/documento/limpar}" method="post">
                <button type="submit" class="btn btn-sm">Remover documento</button>
            </form>
        </div>
    </section>

    <div class="controles">
        <!-- Upload de arquivo -->
        <form th:action="@{/chat/documento/upload}" method="post" enctype="multipart/form-data" class="form-upload">
            <label class="arquivo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                <span class="arquivo-texto">Escolha um arquivo <strong>.txt</strong> ou <strong>.md</strong></span>
                <input type="file" name="arquivo" accept=".txt,.md" required aria-label="Carregar arquivo .txt ou .md" />
            </label>

            <!-- Alternar Estrategia: o select usa form="form-estrategia" para ficar visualmente ao lado -->
            <span class="rotulo-campo">Strategy</span>
            <select name="estrategia" class="select" form="form-estrategia" aria-label="Alternar Strategy">
                <option th:each="est : ${estrategias}"
                        th:value="${est}"
                        th:text="${est}"
                        th:selected="${est == estrategiaAtual}"></option>
            </select>

            <div class="linha-botoes">
                <button type="submit" class="btn" form="form-estrategia">
                    Trocar
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>
                </button>
                <button type="submit" class="btn btn-rosa">
                    Carregar
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 10h4v11H2zM8 21h9.3a2 2 0 0 0 2-1.6l1.6-7.5A2 2 0 0 0 19 9.5h-5.3l.8-3.9A2 2 0 0 0 12.6 3L8 9v12z"/></svg>
                </button>
            </div>
        </form>

        <form id="form-estrategia" th:action="@{/chat/estrategia}" method="post" class="form-estrategia"></form>
    </div>
</div>

</body>
</html>
