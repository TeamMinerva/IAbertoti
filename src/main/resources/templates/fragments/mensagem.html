<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Composite: menor "folha" da arvore de componentes da GUI, representa uma unica mensagem -->
<div th:fragment="mensagem(msg)" th:classappend="${msg.autor().name() == 'USUARIO'} ? 'mensagem-usuario' : 'mensagem-assistente'" class="mensagem">
    <div class="mensagem-autor">
        <strong th:text="${msg.autor().name() == 'USUARIO' ? 'Voce' : 'Assistente IA'}">AUTOR</strong>
    </div>
    <div class="mensagem-conteudo" th:text="${msg.conteudo()}">conteudo</div>
</div>

</body>
</html>
