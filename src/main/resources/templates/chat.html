<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>IAbertoti - Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
        .mensagem { padding: 8px 12px; margin: 8px 0; border-radius: 8px; }
        .mensagem-usuario { background: #e8f0fe; }
        .mensagem-assistente { background: #f1f1f1; }
        form { display: flex; gap: 8px; margin-top: 16px; }
        input[type=text] { flex: 1; padding: 8px; }
    </style>
</head>
<body>

<h1>IAbertoti</h1>

<!-- Composite: a página raiz inclui o fragmento "lista de mensagens" -->
<div th:replace="~{fragments/lista-mensagens :: lista(${mensagens})}"></div>

<form th:action="@{/chat}" method="post">
    <input type="text" name="pergunta" placeholder="Digite sua pergunta" required />
    <button type="submit">Enviar</button>
</form>

</body>
</html>
